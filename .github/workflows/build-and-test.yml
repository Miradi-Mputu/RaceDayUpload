name: RaceDay CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Find and restore the .sln file anywhere in the repo
    - name: Restore dependencies
      run: dotnet restore **/*.sln

    # Build the solution
    - name: Build API and MVC
      run: dotnet build **/*.sln --no-restore --configuration Release

    # Run the tests
    - name: Run unit tests
      run: dotnet test **/*.sln --no-build --configuration Release --verbosity normal
